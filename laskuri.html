<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laskuri</title>
    <link rel="stylesheet" href="style.css">
    <script src="navigointi.js"></script>
    <script src="saastolaskuri.js"></script>
</head>

<body>
    <div class="laskuri-sivu" onclick="handleInteraction()">
        <div class="henkilo">
            <div class="label">Paula (tässä kuussa)</div>
            <div id="paula-saasto" class="euro">...</div>
        </div>
        <div class="henkilo">
            <div class="label">Tomi (tässä kuussa)</div>
            <div id="tomi-saasto" class="euro">...</div>
        </div>
        <div class="yhteensa-kuukausi">
            <div id="kuukausi-otsikko" class="label">Yhteensä</div>
            <div id="yhteensa-saasto" class="euro">...</div>
        </div>
        <div class="kaikki-yhteensa">
            <div class="label">Säästöt <span id="vuosi-otsikko"></span></div>
            <div id="kaikki-saasto" class="euro">...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ASETUKSET
        // ==========================================
        // Päivitysväli poistettu — update() kutsutaan kerran ladattaessa, ei intervallia

        // Paula: vertailuarvo (loka-joulu 2025 ka.) 1199.32 - kuukauden kulutus
        // Lahde: Actual Budget (eri kategoriat kuin Tomi)
        const paulaHistory = [
            { alkaen: [2026, 0, 1], summa: 589.26 },
            { alkaen: [2026, 1, 1], summa: 629.04 },
            { alkaen: [2026, 2, 1], summa: 365.08 }
        ];
        // Tomi: vertailuarvo (loka-joulu 2025 ka.) 1766.51 - kuukauden kulutus
        // Lahde: Actual Budget > Kulutusosio vain -raportti
        const tomiHistory = [
            { alkaen: [2026, 0, 1], summa: 957.51 },
            { alkaen: [2026, 1, 1], summa: 757.18 },
            { alkaen: [2026, 2, 1], summa: 491.89 }
        ];
        const nykyinenVuosi = new Date().getFullYear();
        const vuosiAlku = [nykyinenVuosi, 0, 1];

        const months = ["Tammikuussa", "Helmikuussa", "Maaliskuussa", "Huhtikuussa", "Toukokuussa",
            "Kesäkuussa", "Heinäkuussa", "Elokuussa", "Syyskuussa", "Lokakuussa",
            "Marraskuussa", "Joulukuussa"];

        // Saastolaskenta on keskitetty saastolaskuri.js:aan (jaettu testien kanssa)
        const { parseDate, calculateSavings } = window.Saastolaskuri;

        function update() {
            const now = new Date();
            const nowMs = now.getTime();
            const monthStartMs = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            const yearStartMs = parseDate(vuosiAlku);

            const pM = calculateSavings(paulaHistory, monthStartMs, nowMs);
            const tM = calculateSavings(tomiHistory, monthStartMs, nowMs);
            const pY = calculateSavings(paulaHistory, yearStartMs, nowMs);
            const tY = calculateSavings(tomiHistory, yearStartMs, nowMs);

            document.getElementById("paula-saasto").innerText = pM.toFixed(2) + " €";
            document.getElementById("tomi-saasto").innerText = tM.toFixed(2) + " €";
            document.getElementById("yhteensa-saasto").innerText = (pM + tM).toFixed(2) + " €";
            document.getElementById("kaikki-saasto").innerText = (pY + tY).toFixed(2) + " €";
            document.getElementById("kuukausi-otsikko").innerText = "Yhteensä " + months[now.getMonth()];
            const vuosiEl = document.getElementById("vuosi-otsikko");
            if (vuosiEl) vuosiEl.innerText = nykyinenVuosi;
        }

        function handleInteraction() {
            update();
            if (window.parent && window.parent !== window) return;
            pyydaFullscreen();
        }

        window.onload = function () {
            update();
        };

        // (Poistettu kuollut viestikuuntelija: laskuri.html on aina lapsi-iframe,
        //  joka ei vastaanota 'pysayta'/'kaynnista'-stringeja — parent lahettaa
        //  lapsille vain {type:...}-objekteja. Kasittelija ei koskaan lauennut.)

    </script>
    <script src="version.js"></script>
    <script src="versio.js"></script>
</body>

</html>
