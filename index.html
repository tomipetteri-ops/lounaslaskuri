<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Paula & Tomi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Iframe täyttää koko ruudun */
        #dia-kehys {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

/* VAPAAEHTOINEN testileima - poista kun vahvistettu paivitys */
.testileima {
    position: fixed;
    top: 5px;
    right: 10px;
    font-size: 18px;
    opacity: 0.7;
    pointer-events: none;
    color: black;
    z-index: 9999;
    font-family: 'Courier New', Courier, monospace;
}
    </style>
</head>

<body>
    <div style="width: 100vw; height: 100vh;">
        <iframe id="dia-kehys" src="laskuri.html"></iframe>
    </div>
    <div class="testileima">TESTI v6</div>

    <script src="navigointi.js"></script>
    <script>
        // Lataa diagnostiikka.js vain jos diagnostiikka on paalla
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            var s = document.createElement('script');
            s.src = 'diagnostiikka.js';
            document.head.appendChild(s);
        }
    </script>
    <script>
        // ==========================================
        //  ASETUKSET — luetaan localStoragesta
        // ==========================================
        let lounasAjat = { laskuri: 1, kuvat: 1, goals: 1 };
        // Tyhjenna vanhat asetukset kun cache-versio paivittyy
        var ASETUKSET_VERSIO = 16;
        var edellinenVersio = parseInt(localStorage.getItem('lounas_asetukset_versio') || '0', 10);
        if (edellinenVersio < ASETUKSET_VERSIO) {
            localStorage.removeItem('lounas_ajat');
            localStorage.setItem('lounas_asetukset_versio', String(ASETUKSET_VERSIO));
            console.log('[asetukset] vanhat ajat tyhjennetty, versio ' + ASETUKSET_VERSIO);
        }
        try {
            const tallennettu = localStorage.getItem('lounas_ajat');
            if (tallennettu) {
                lounasAjat = JSON.parse(tallennettu);
            }
        } catch (e) { console.error("Asetuksien lataus epäonnistui", e); }

        const DIAT = [
            { tiedosto: 'laskuri.html', aika: lounasAjat.laskuri || 1 },
            { tiedosto: 'kuvat.html', aika: lounasAjat.kuvat || 1 },
            { tiedosto: 'goals.html', aika: lounasAjat.goals || 1 },
        ];

        // Diagnostiikka-dia ehdollisesti
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            DIAT.push({ tiedosto: 'diagnostiikka.html', aika: lounasAjat.diagnostiikka || 8 });
        }

        // Diagnostiikka: metriikoiden keruu
        var __diagKooste = {};
        var sivuLataukset = {};
        // ==========================================

        let nykyinenDia = 0;
        let ajastin = null;
        function naytaDia(indeksi) {
            nykyinenDia = indeksi % DIAT.length;
            const dia = DIAT[nykyinenDia];

            // Keraa diagnostiikka edelliselta iframelta ennen vaihtoa
            const iframe = document.getElementById('dia-kehys');
            try {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'keraaDiagnostiikka' }, '*');
                }
            } catch (e) { }

            // Seuraa sivulatauksia
            sivuLataukset[dia.tiedosto] = (sivuLataukset[dia.tiedosto] || 0) + 1;

            // Vaihda iframe
            iframe.src = dia.tiedosto;

            // Ajastin seuraavaan diaan (aika minuutteina)
            clearTimeout(ajastin);
            ajastin = setTimeout(() => naytaDia(nykyinenDia + 1), dia.aika * 60 * 1000);
        }

        // Käynnistys
        window.onload = () => naytaDia(0);

        // Screen Wake Lock — kanoninen pattern (Chrome/MDN 2026)
        // HUOM: Wake Lock estaa vain naytonsammutuksen, EI Android Dozea.
        // Boox Settings -> Apps -> Chrome -> Battery -> Don't optimize on myos tarpeen.
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if (!(navigator.wakeLock && navigator.wakeLock.request)) return;
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', function () {
                    // Ei nollata — visibility-handler tarkistaa !== null
                    console.log('[wakelock] released');
                });
                console.log('[wakelock] acquired');
            } catch (err) {
                console.warn('[wakelock] failed:', err && err.name, err && err.message);
            }
        }
        async function handleVisibilityChange() {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        }
        document.addEventListener('visibilitychange', handleVisibilityChange);
        requestWakeLock();

        // Akun lahtotason talletus — seuraa drain-nopeutta luotettavasti
        // Tallennetaan { taso, aikaleima } localStorageen. Jos arvo > 24h vanha,
        // nollataan (pitka mittaus tuottaa virheellisia paivittaisia lukuja).
        (async function tallennaAkkuAlku() {
            if (!navigator.getBattery) return;
            try {
                var b = await navigator.getBattery();
                var taso = Math.round(b.level * 100);
                var nyt = Date.now();
                var tallennettu = null;
                try { tallennettu = JSON.parse(localStorage.getItem('lounas_akku_alku')); } catch (e) { }
                var ika = tallennettu ? (nyt - tallennettu.aikaleima) : Infinity;
                // Resetoi jos ei tallennettu, > 24h, tai taso noussut (lataus)
                if (!tallennettu || ika > 86400000 || taso > tallennettu.taso + 3) {
                    localStorage.setItem('lounas_akku_alku', JSON.stringify({ taso: taso, aikaleima: nyt }));
                    console.log('[akku] lahtotaso talletettu:', taso + '%');
                } else {
                    console.log('[akku] kaytossa tallennettu lahtotaso:', tallennettu.taso + '% @ ' + new Date(tallennettu.aikaleima).toLocaleTimeString());
                }
            } catch (e) {
                console.warn('[akku] getBattery failed:', e);
            }
        })();

        // Kuuntele goals.html:n pysäytysviesti
        window.addEventListener('message', function (e) {
            if (e.data === 'pysayta') {
                clearTimeout(ajastin);
            } else if (e.data === 'kaynnista') {
                // Jatka diaesitystä seuraavasta diasta
                naytaDia(nykyinenDia + 1);
            } else if (e.data === 'jatka') {
                // Jatka ajastinta nykyisella dialla (ei vaihda seuraavaan)
                clearTimeout(ajastin);
                var dia = DIAT[nykyinenDia];
                ajastin = setTimeout(() => naytaDia(nykyinenDia + 1), dia.aika * 60 * 1000);
            } else if (e.data.type === 'diagnostiikka') {
                // Tallenna lapsi-iframen diagnostiikkadata
                __diagKooste[e.data.sivu] = e.data.data;
            } else if (e.data.type === 'haeDiagnostiikka') {
                // Diagnostiikka.html pyytaa koostetta
                var parentDiag = window.__diag ? JSON.parse(JSON.stringify(window.__diag)) : {};
                if (performance.memory) {
                    parentDiag.muisti = {
                        kaytetty: performance.memory.usedJSHeapSize,
                        kokonais: performance.memory.totalJSHeapSize
                    };
                }
                parentDiag.uptime = performance.now();
                var iframe = document.getElementById('dia-kehys');
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        type: 'diagnostiikkaData',
                        kooste: __diagKooste,
                        parent: parentDiag,
                        lataukset: sivuLataukset
                    }, '*');
                }
            } else if (e.data.type === 'seuraavaDia') {
                naytaDia(nykyinenDia + 1);
            } else if (e.data.type === 'edellinenDia') {
                naytaDia(nykyinenDia - 1 < 0 ? DIAT.length - 1 : nykyinenDia - 1);
            } else if (e.data.type === 'ajatPaivitetty') {
                const laskuriIdx = DIAT.findIndex(dia => dia.tiedosto === 'laskuri.html');
                if (laskuriIdx !== -1) DIAT[laskuriIdx].aika = e.data.laskuri || 1;

                const goalsIdx = DIAT.findIndex(dia => dia.tiedosto === 'goals.html');
                if (goalsIdx !== -1) DIAT[goalsIdx].aika = e.data.goals || 1;

                const kuvatIdx = DIAT.findIndex(dia => dia.tiedosto === 'kuvat.html');
                if (kuvatIdx !== -1) DIAT[kuvatIdx].aika = e.data.kuvat || 1;

                console.log(`Ajat päivitetty: laskuri ${DIAT[laskuriIdx].aika}min, goals ${DIAT[goalsIdx].aika}min, kuvat ${DIAT[kuvatIdx].aika}min`);
            }
        });

        // Service worker — offline-tuki
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(function () { });
        }

        // Fullscreen kun klikataan
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => { });
            }
        });
    </script>
</body>

</html>
