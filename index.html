<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Paula & Tomi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Iframe täyttää koko ruudun */
        #dia-kehys {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Edistymispalkki alareunassa */
        #edistymispalkki {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: black;
            z-index: 100;
            transition: none;
        }
    </style>
</head>

<body>
    <div style="width: 100vw; height: 100vh;">
        <iframe id="dia-kehys" src="laskuri.html"></iframe>
        <div id="edistymispalkki" style="width:0%"></div>
    </div>

    <script src="diagnostiikka.js"></script>
    <script>
        // ==========================================
        //  ASETUKSET — luetaan localStoragesta
        // ==========================================
        let lounasAjat = { laskuri: 5, goals: 5 };
        try {
            const tallennettu = localStorage.getItem('lounas_ajat');
            if (tallennettu) {
                lounasAjat = JSON.parse(tallennettu);
            }
        } catch (e) { console.error("Asetuksien lataus epäonnistui", e); }

        const nullKuvatAika = lounasAjat.kuvat || 5;

        const DIAT = [
            { tiedosto: 'laskuri.html', aika: lounasAjat.laskuri || 5 },
            { tiedosto: 'kuvat.html', aika: nullKuvatAika, perusKuvatAika: nullKuvatAika },
            { tiedosto: 'goals.html', aika: lounasAjat.goals || 5 },
        ];

        // Diagnostiikka-dia ehdollisesti
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            DIAT.push({ tiedosto: 'diagnostiikka.html', aika: lounasAjat.diagnostiikka || 8 });
        }

        // Diagnostiikka: metriikoiden keruu
        var __diagKooste = {};
        var sivuLataukset = {};
        // ==========================================

        let nykyinenDia = 0;
        let ajastin = null;

        function naytaDia(indeksi) {
            nykyinenDia = indeksi % DIAT.length;
            const dia = DIAT[nykyinenDia];

            // Keraa diagnostiikka edelliselta iframelta ennen vaihtoa
            const iframe = document.getElementById('dia-kehys');
            try {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'keraaDiagnostiikka' }, '*');
                }
            } catch (e) { }

            // Seuraa sivulatauksia
            sivuLataukset[dia.tiedosto] = (sivuLataukset[dia.tiedosto] || 0) + 1;

            // Vaihda iframe
            iframe.src = dia.tiedosto;

            // Jos siirrytään kuvat.html:ään, lähetetään sille nykyinen kuvien perusaika viiveellä
            if (dia.tiedosto === 'kuvat.html') {
                setTimeout(() => {
                    if (iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ type: 'asetaKuvaAika', aika: dia.perusKuvatAika }, '*');
                    }
                }, 500); // Odotetaan että iframe on ladannut
            }

            // Edistymispalkki
            const palkki = document.getElementById('edistymispalkki');
            palkki.style.transition = 'none';
            palkki.style.width = '0%';
            setTimeout(() => {
                palkki.style.transition = 'width ' + dia.aika + 's linear';
                palkki.style.width = '100%';
            }, 50);

            // Ajastin seuraavaan diaan
            clearTimeout(ajastin);
            ajastin = setTimeout(() => naytaDia(nykyinenDia + 1), dia.aika * 1000);
        }

        // Käynnistys
        window.onload = () => naytaDia(0);

        // Kuuntele goals.html:n pysäytysviesti
        window.addEventListener('message', function (e) {
            if (e.data === 'pysayta') {
                clearTimeout(ajastin);
                // Pysäytä edistymispalkki
                const palkki = document.getElementById('edistymispalkki');
                const leveys = palkki.getBoundingClientRect().width / window.innerWidth * 100;
                palkki.style.transition = 'none';
                palkki.style.width = leveys + '%';
            } else if (e.data === 'kaynnista') {
                // Jatka diaesitystä seuraavasta diasta
                naytaDia(nykyinenDia + 1);
            } else if (e.data.type === 'kuvienAika') {
                // Etsi kuvat.html dia ja päivitä sen aika
                const kuvatDiaIndex = DIAT.findIndex(dia => dia.tiedosto === 'kuvat.html');
                if (kuvatDiaIndex !== -1) {
                    DIAT[kuvatDiaIndex].aika = e.data.aika;
                    console.log(`Kuvat.html dian kokonaisaika päivitetty: ${e.data.aika}s`);
                    // Jos kuvat.html on jo esillä, ÄLÄ kutsu naytaDia() – se lataisi iframen uudelleen
                    // ja katkaisisi kuvien kierron. Päivitä vain ajastin ja palkki.
                    if (nykyinenDia === kuvatDiaIndex) {
                        const dia = DIAT[kuvatDiaIndex];
                        const palkki = document.getElementById('edistymispalkki');
                        palkki.style.transition = 'none';
                        palkki.style.width = '0%';
                        setTimeout(() => {
                            palkki.style.transition = 'width ' + dia.aika + 's linear';
                            palkki.style.width = '100%';
                        }, 50);
                        clearTimeout(ajastin);
                        ajastin = setTimeout(() => naytaDia(nykyinenDia + 1), dia.aika * 1000);
                    }
                }
            } else if (e.data.type === 'diagnostiikka') {
                // Tallenna lapsi-iframen diagnostiikkadata
                __diagKooste[e.data.sivu] = e.data.data;
            } else if (e.data.type === 'haeDiagnostiikka') {
                // Diagnostiikka.html pyytaa koostetta
                var parentDiag = window.__diag ? JSON.parse(JSON.stringify(window.__diag)) : {};
                if (performance.memory) {
                    parentDiag.muisti = {
                        kaytetty: performance.memory.usedJSHeapSize,
                        kokonais: performance.memory.totalJSHeapSize
                    };
                }
                parentDiag.uptime = performance.now();
                var iframe = document.getElementById('dia-kehys');
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        type: 'diagnostiikkaData',
                        kooste: __diagKooste,
                        parent: parentDiag,
                        lataukset: sivuLataukset
                    }, '*');
                }
            } else if (e.data.type === 'ajatPaivitetty') {
                // Päivitä DIAT-taulukon ajat muille paitsi kuvat.html (jonka kokonaisaika säätyy automaattisesti, mutta perusaika päivitetään)
                const laskuriIdx = DIAT.findIndex(dia => dia.tiedosto === 'laskuri.html');
                if (laskuriIdx !== -1) DIAT[laskuriIdx].aika = e.data.laskuri || 5;

                const goalsIdx = DIAT.findIndex(dia => dia.tiedosto === 'goals.html');
                if (goalsIdx !== -1) DIAT[goalsIdx].aika = e.data.goals || 5;

                const kuvatIdx = DIAT.findIndex(dia => dia.tiedosto === 'kuvat.html');
                if (kuvatIdx !== -1) {
                    DIAT[kuvatIdx].perusKuvatAika = e.data.kuvat || 5;
                    // Välitetään tieto heti iframelle jos se on kuvat.html
                    if (nykyinenDia === kuvatIdx) {
                        const iframe = document.getElementById('dia-kehys');
                        if (iframe.contentWindow) {
                            iframe.contentWindow.postMessage({ type: 'asetaKuvaAika', aika: e.data.kuvat || 5 }, '*');
                        }
                    }
                }

                console.log(`Ajat päivitetty: laskuri ${DIAT[laskuriIdx].aika}s, goals ${DIAT[goalsIdx].aika}s, kuvat base ${DIAT[kuvatIdx].perusKuvatAika}s`);
            }
        });

        // Service worker — offline-tuki
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(function () { });
        }

        // Fullscreen kun klikataan
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => { });
            }
        });
    </script>
</body>

</html>
