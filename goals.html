<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goals</title>
    <script src="navigointi.js"></script>
    <script>
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            var s = document.createElement('script');
            s.src = 'diagnostiikka.js';
            document.head.appendChild(s);
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 12px 16px 0 16px;
        }

        .goals-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1em;
            overflow: auto;
        }

        .osio {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            min-height: 0;
        }

        .osio-rivi {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            min-height: 0;
        }

        .osio-vasen {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            min-width: 80px;
            padding-left: 8px;
        }

        .ascii-taide {
            font-size: inherit;
            line-height: 1.1;
            white-space: pre;
            margin: 0;
            font-family: inherit;
        }

        .goals-nimi {
            font-size: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            width: 100%;
        }

        .osio-oikea {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
            padding-top: 2px;
            overflow: hidden;
            min-height: 0;
        }

        .goals-rivi {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
            font-size: 0.9em;
            min-height: 1em;
        }

        .goals-rivi span {
            flex: 1;
            outline: none;
            cursor: pointer;
        }

        .rivi-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid black;
            background: white;
            z-index: 30;
            flex-direction: column;
            min-width: 280px;
        }

        .rivi-popup.auki {
            display: flex;
        }

        .rivi-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 25;
        }

        .rivi-popup-overlay.auki {
            display: block;
        }

        .alapalkki {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-top: 1px solid black;
            background: white;
            z-index: 20;
        }

        .alapalkki-nappi {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(0.7rem, 1.8vw, 1.1rem);
            font-weight: bold;
            border: 1px solid black;
            background: white;
            color: black;
            padding: 6px 14px;
            cursor: pointer;
        }

        .alapalkki-nappi:active {
            background: black;
            color: white;
        }

        .info {
            font-size: 0.6rem;
            opacity: 0.4;
            flex: 1;
        }

        .popup {
            display: none;
            position: absolute;
            bottom: 100%;
            border: 1px solid black;
            background: white;
            z-index: 10;
            flex-direction: column;
            min-width: 280px;
        }

        .popup.auki {
            display: flex;
        }

        .popup-vaihtoehto {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        .popup-vaihtoehto:last-child {
            border-bottom: none;
        }

        .popup-vaihtoehto:hover {
            background: black;
            color: white;
        }

        .popup-vaihtoehto.otsikko {
            opacity: 0.4;
            cursor: default;
            font-size: 1.5rem;
            padding: 8px 12px 4px;
        }

        .popup-vaihtoehto.otsikko:hover {
            background: white;
            color: black;
        }

        .asetus-rivi {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
        }

        .asetus-rivi input {
            width: 100px;
            font-family: inherit;
            font-size: inherit;
            text-align: center;
            border: 1px solid #ccc;
        }

    </style>
</head>

<body>

    <div class="goals-container">
        <div class="osio">
            <div class="osio-rivi">
                <div class="osio-vasen">
                    <pre class="ascii-taide"> /\_/\
( o.o )
 &gt; ^ &lt;</pre>
                    <div class="goals-nimi">Paula</div>
                </div>
                <div class="osio-oikea" id="paula-lista"></div>
            </div>
        </div>

        <div class="osio">
            <div class="osio-rivi">
                <div class="osio-vasen">
                    <pre class="ascii-taide"> .-.
 |o|
/|_|\
 | |
 / \</pre>
                    <div class="goals-nimi">Tomi</div>
                </div>
                <div class="osio-oikea" id="tomi-lista"></div>
            </div>
        </div>

        <div class="osio">
            <div class="osio-rivi">
                <div class="osio-vasen">
                    <pre class="ascii-taide"> **  **
*  **  *
*      *
 *    *
  *  *
   **</pre>
                    <div class="goals-nimi">Yhdessa</div>
                </div>
                <div class="osio-oikea" id="yhteiset-lista"></div>
            </div>
        </div>
    </div>

    <div class="rivi-popup-overlay" id="rivi-overlay" onclick="suljeRiviPopup()"></div>
    <div class="rivi-popup" id="rivi-popup">
        <div class="popup-vaihtoehto otsikko" id="rivi-popup-teksti"></div>
        <div class="popup-vaihtoehto" onclick="muokkaaValittua()">Muokkaa</div>
        <div class="popup-vaihtoehto" onclick="poistaValittu()">Poista</div>
        <div class="popup-vaihtoehto" onclick="suljeRiviPopup()">Peruuta</div>
    </div>

    <div class="alapalkki"><button class="alapalkki-nappi" onclick="kaynnistaDia()">▶ JATKA</button>
        <button class="alapalkki-nappi" onclick="togglePopup('lisaa-popup')">+ lisaa</button>
        <div class="info" id="info"></div>
        <button class="alapalkki-nappi" onclick="togglePopup('asetukset-popup')">⚙ Asetukset</button>
        <button class="alapalkki-nappi" onclick="togglePopup('toiminto-popup')">&#8943;</button>

        <div class="popup" id="lisaa-popup" style="left: 0;">
            <div class="popup-vaihtoehto otsikko">Kenelle?</div>
            <div class="popup-vaihtoehto" onclick="lisaaRivi('paula')">Paula</div>
            <div class="popup-vaihtoehto" onclick="lisaaRivi('tomi')">Tomi</div>
            <div class="popup-vaihtoehto" onclick="lisaaRivi('yhteiset')">Yhdessa</div>
        </div>

        <div class="popup" id="toiminto-popup" style="right: 0;">
            <div class="popup-vaihtoehto otsikko">Kenelle?</div>
            <div class="popup-vaihtoehto" onclick="naytaToiminnot('paula')">Paula</div>
            <div class="popup-vaihtoehto" onclick="naytaToiminnot('tomi')">Tomi</div>
            <div class="popup-vaihtoehto" onclick="naytaToiminnot('yhteiset')">Yhdessa</div>
        </div>

        <div class="popup" id="tallenna-popup" style="right: 0;">
            <div class="popup-vaihtoehto otsikko" id="tallenna-otsikko"></div>
            <div class="popup-vaihtoehto" onclick="tyhjennaGoals()">Tyhjenna</div>
        </div>

        <div class="popup" id="asetukset-popup" style="right: 0;">
            <div class="popup-vaihtoehto otsikko">Ajat (sekuntia)</div>
            <div class="asetus-rivi">
                <span>Laskuri:</span>
                <input type="number" id="asetus-laskuri" min="1" max="300" value="5">
            </div>
            <div class="asetus-rivi">
                <span>Kuvat:</span>
                <input type="number" id="asetus-kuvat" min="1" max="300" value="5">
            </div>
            <div class="asetus-rivi">
                <span>Goals:</span>
                <input type="number" id="asetus-goals" min="1" max="300" value="5">
            </div>
            <div class="asetus-rivi">
                <span>Diagnostiikka:</span>
                <input type="checkbox" id="asetus-diagnostiikka">
            </div>
            <div class="popup-vaihtoehto" style="text-align: center; font-weight: bold;" onclick="tallennaAsetukset()">
                Tallenna</div>
        </div>
    </div>

    <script>
        var valittuHenkilo = null;
        var valittuRivi = null;
        var valittuRiviHenkilo = null;

        function avaaRiviPopup(rivi, h) {
            valittuRivi = rivi;
            valittuRiviHenkilo = h;
            var teksti = rivi.querySelector('span').innerText.trim();
            document.getElementById('rivi-popup-teksti').innerText = teksti || '(tyhja)';
            document.getElementById('rivi-popup').classList.add('auki');
            document.getElementById('rivi-overlay').classList.add('auki');
            pysaytaDia();
        }

        function suljeRiviPopup() {
            document.getElementById('rivi-popup').classList.remove('auki');
            document.getElementById('rivi-overlay').classList.remove('auki');
            valittuRivi = null;
            valittuRiviHenkilo = null;
        }

        function poistaValittu() {
            if (valittuRivi && valittuRiviHenkilo) {
                valittuRivi.remove();
                autoTallenna(valittuRiviHenkilo);
            }
            suljeRiviPopup();
        }

        function muokkaaValittua() {
            if (valittuRivi) {
                var rivi = valittuRivi;
                var h = valittuRiviHenkilo;
                var span = rivi.querySelector('span');
                suljeRiviPopup();
                span.contentEditable = true;
                span.focus();
                var blurDone = false;
                span.addEventListener('blur', function onBlur() {
                    if (blurDone) return;
                    blurDone = true;
                    span.contentEditable = false;
                    if (!span.innerText.trim() && rivi.parentNode) { rivi.remove(); }
                    autoTallenna(h);
                    span.removeEventListener('blur', onBlur);
                });
                span.addEventListener('keydown', function onKey(e) {
                    if (e.key === 'Enter') { e.preventDefault(); span.blur(); }
                    span.removeEventListener('keydown', onKey);
                });
            }
        }

        function kaynnistaDia() {
            try { window.parent.postMessage('kaynnista', '*'); } catch (e) { }
        }
        function pysaytaDia() {
            try { window.parent.postMessage('pysayta', '*'); } catch (e) { }
        }

        function autoTallenna(h) {
            var lista = document.getElementById(h + '-lista');
            var rivit = Array.from(lista.querySelectorAll('.goals-rivi span'))
                .map(function (s) { return s.innerText.trim(); })
                .filter(function (t) { return t.length > 0; });
            localStorage.setItem('goals_' + h, JSON.stringify(rivit));
        }

        function togglePopup(id) {
            var popup = document.getElementById(id);
            var onAuki = popup.classList.contains('auki');
            suljeKaikki();
            if (!onAuki) {
                popup.classList.add('auki');
                if (id === 'lisaa-popup' || id === 'toiminto-popup' || id === 'asetukset-popup') pysaytaDia();
            }
        }

        function suljeKaikki() {
            ['lisaa-popup', 'toiminto-popup', 'tallenna-popup', 'asetukset-popup'].forEach(function (id) {
                document.getElementById(id).classList.remove('auki');
            });
        }

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.popup') &&
                !e.target.classList.contains('alapalkki-nappi') &&
                !e.target.classList.contains('popup-vaihtoehto')) {
                suljeKaikki();
            }
        });

        function naytaToiminnot(h) {
            valittuHenkilo = h;
            document.getElementById('tallenna-otsikko').innerText = h.charAt(0).toUpperCase() + h.slice(1);
            document.getElementById('toiminto-popup').classList.remove('auki');
            document.getElementById('tallenna-popup').classList.add('auki');
        }

        function lisaaRivi(h, teksti, alaTallenna) {
            suljeKaikki();
            if (alaTallenna !== false) pysaytaDia();
            var lista = document.getElementById(h + '-lista');
            var rivi = document.createElement('div');
            rivi.className = 'goals-rivi';
            var span = document.createElement('span');
            span.innerText = teksti || '';
            if (!teksti) {
                span.contentEditable = true;
                span.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') { e.preventDefault(); span.contentEditable = false; autoTallenna(h); lisaaRivi(h); }
                });
                span.addEventListener('blur', function () {
                    span.contentEditable = false;
                    if (!span.innerText.trim() && rivi.parentNode) { rivi.remove(); }
                    autoTallenna(h);
                });
            } else {
                span.addEventListener('click', function () { avaaRiviPopup(rivi, h); });
            }
            rivi.appendChild(span);
            lista.appendChild(rivi);
            if (!teksti) { span.focus(); }
        }

        function tyhjennaGoals() {
            suljeKaikki();
            var h = valittuHenkilo;
            if (confirm('Tyhjennetaanko ' + h + '?')) {
                document.getElementById(h + '-lista').innerHTML = '';
                localStorage.removeItem('goals_' + h);
            }
        }

        function lataaAsetukset() {
            try {
                var tallennettu = localStorage.getItem('lounas_ajat');
                if (tallennettu) {
                    var ajat = JSON.parse(tallennettu);
                    if (ajat.laskuri) document.getElementById('asetus-laskuri').value = ajat.laskuri;
                    if (ajat.kuvat) document.getElementById('asetus-kuvat').value = ajat.kuvat;
                    if (ajat.goals) document.getElementById('asetus-goals').value = ajat.goals;
                }
            } catch (e) { }

            // Diagnostiikka-checkbox
            var diagPaalla = localStorage.getItem('lounas_diagnostiikka') === 'true';
            document.getElementById('asetus-diagnostiikka').checked = diagPaalla;
        }

        function tallennaAsetukset() {
            var laskuri = parseInt(document.getElementById('asetus-laskuri').value, 10) || 5;
            var kuvat = parseInt(document.getElementById('asetus-kuvat').value, 10) || 5;
            var goals = parseInt(document.getElementById('asetus-goals').value, 10) || 5;

            var ajat = { laskuri: laskuri, kuvat: kuvat, goals: goals };
            localStorage.setItem('lounas_ajat', JSON.stringify(ajat));

            // Diagnostiikka-asetus
            var diagPaalla = document.getElementById('asetus-diagnostiikka').checked;
            localStorage.setItem('lounas_diagnostiikka', diagPaalla ? 'true' : 'false');

            try {
                window.parent.postMessage({ type: 'ajatPaivitetty', laskuri: laskuri, kuvat: kuvat, goals: goals }, '*');
            } catch (e) { }

            suljeKaikki();
            kaynnistaDia();
        }

        function lataaGoals() {
            ['paula', 'tomi', 'yhteiset'].forEach(function (h) {
                var tallennettu = localStorage.getItem('goals_' + h);
                if (tallennettu) {
                    JSON.parse(tallennettu).forEach(function (teksti) {
                        lisaaRivi(h, teksti, false);
                    });
                }
            });
            lataaAsetukset();
            skaalaaFontit();
        }

        function skaalaaFontit() {
            var container = document.querySelector('.goals-container');
            if (!container) return;
            var maxFont = 26;
            var minFont = 8;
            for (var fs = maxFont; fs >= minFont; fs -= 2) {
                container.style.fontSize = fs + 'px';
                if (container.scrollHeight <= container.clientHeight) {
                    return;
                }
            }
            container.style.fontSize = minFont + 'px';
        }

        window.onload = function () {
            lataaGoals();
            skaalaaFontit();
            var c = document.querySelector('.goals-container');
            if (c && typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(skaalaaFontit).observe(c);
            }
            ['paula', 'tomi', 'yhteiset'].forEach(function (h) {
                var lista = document.getElementById(h + '-lista');
                if (lista && typeof MutationObserver !== 'undefined') {
                    new MutationObserver(skaalaaFontit).observe(lista, { childList: true, subtree: true, characterData: true });
                }
            });
        };
    </script>
    <div style="position:fixed; bottom:2px; right:5px; font-size:10px; opacity:0.3; pointer-events:none;">v1.2_0304
    </div>
</body>

</html>
