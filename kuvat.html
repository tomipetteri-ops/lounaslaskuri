<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuvat</title>
    <link rel="stylesheet" href="style.css">
    <script src="navigointi.js"></script>
    <script>
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            var s = document.createElement('script');
            s.src = 'diagnostiikka.js';
            document.head.appendChild(s);
        }
    </script>
    <style>
        .kuva-info {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            font-size: 0.85rem;
            border-top: 2px solid black;
            flex-shrink: 0;
        }

        .kuva-info label {
            cursor: pointer;
        }

        .kuva-info span {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="kuvat-sivu">
        <div class="kuva-nakymä" id="kuva-nakymä">
            <div class="kuva-placeholder" id="kuva-placeholder" style="display:none;">
            </div>
            <img id="kuva-img" src="" style="display:none;" alt="Kuva">
        </div>
        <div class="kuva-info">
            <span id="kuva-laskuri">Ladataan...</span>
            <label for="kuva-input-lisaa" onclick="try{window.parent.postMessage('pysayta','*')}catch(e){}">+ Lisää
                kuvia</label>
            <input type="file" id="kuva-input-lisaa" accept="image/*" multiple onchange="lisaaKuvat(event)"
                style="display:none;">
            <span onclick="tyhjennaKuvat()">🗑 Tyhjennä</span>
        </div>
    </div>

    <script>
        // ==========================================
        // ASETUKSET
        // ==========================================
        // kuvaAika poistettu — yksi kuva per kierros, aika säädetään index.html:ssä

        // ==========================================
        // INDEXEDDB
        // ==========================================
        const DB_NIMI = 'lounaslaskuri_kuvat';
        const DB_VERSIO = 1;
        const STORE_NIMI = 'kuvat';
        let db = null;

        function avaaDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NIMI, DB_VERSIO);
                req.onupgradeneeded = function (e) {
                    const tietokanta = e.target.result;
                    if (!tietokanta.objectStoreNames.contains(STORE_NIMI)) {
                        tietokanta.createObjectStore(STORE_NIMI, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = function (e) { resolve(e.target.result); };
                req.onerror = function (e) { reject(e); };
            });
        }

        function tallennaKuvaDB(data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readwrite');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.add({ data: data });
                req.onsuccess = (e) => resolve(e.target.result); // palauta uusi id
                req.onerror = (e) => reject(e);
            });
        }

        // Palauta vain ID:t — ei dataa. Nain muistissa on aina vain yksi kuva kerrallaan.
        function lataaKuvienIdtDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readonly');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.getAllKeys();
                req.onsuccess = (e) => resolve(e.target.result || []);
                req.onerror = (e) => reject(e);
            });
        }

        // Hae yhden kuvan data ID:lla — kutsutaan vasta kun kuva nayttetaan.
        function lataaKuvaDataDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readonly');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.get(id);
                req.onsuccess = (e) => resolve(e.target.result ? e.target.result.data : null);
                req.onerror = (e) => reject(e);
            });
        }

        function tyhjennaDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readwrite');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        // ==========================================
        // KUVAT — muistioptimoitu: pidetaan muistissa vain ID-lista, ei dataa.
        // Jokainen paivitaKuva() lataa yhden kuvan IDB:sta ja paastaa edellisen GC:lle.
        // ==========================================
        let kuvaIdt = [];       // vain primary key -lista
        let nykyinenKuva = 0;

        async function lisaaKuvat(event) {
            const tiedostot = Array.from(event.target.files);
            for (const tiedosto of tiedostot) {
                // Lue yksi tiedosto, tallenna ja unohda — ei kasata kaikkia base64-stringeja muistiin
                const dataUrl = await new Promise(function (resolve, reject) {
                    const reader = new FileReader();
                    reader.onload = function (e) { resolve(e.target.result); };
                    reader.onerror = reject;
                    reader.readAsDataURL(tiedosto);
                });
                const uusiId = await tallennaKuvaDB(dataUrl);
                kuvaIdt.push(uusiId);
                // dataUrl lokaali muuttuja → GC vapauttaa saman tien
            }
            nykyinenKuva = 0;
            await paivitaKuva();
            localStorage.setItem('lounas_kuva_indeksi', kuvaIdt.length > 1 ? 1 : 0);
        }

        async function tyhjennaKuvat() {
            if (!confirm('Poistetaanko kaikki kuvat?')) return;
            kuvaIdt = [];
            await tyhjennaDB();
            // Tyhjenna img.src jotta edellinen data URL vapautuu GC:lle
            document.getElementById('kuva-img').src = '';
            await paivitaKuva();
            localStorage.setItem('lounas_kuva_indeksi', '0');
        }

        async function paivitaKuva() {
            const img = document.getElementById('kuva-img');
            const placeholder = document.getElementById('kuva-placeholder');
            const laskuri = document.getElementById('kuva-laskuri');

            if (kuvaIdt.length > 0) {
                if (nykyinenKuva >= kuvaIdt.length) nykyinenKuva = 0;
                // Lataa vain tama yksi kuva IDB:sta — ei muita muistissa
                const data = await lataaKuvaDataDB(kuvaIdt[nykyinenKuva]);
                if (data) {
                    img.src = data;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                    laskuri.innerText = (nykyinenKuva + 1) + " / " + kuvaIdt.length;
                } else {
                    // ID viittaa puuttuvaan tietoon — siivoa
                    kuvaIdt.splice(nykyinenKuva, 1);
                    await paivitaKuva();
                }
            } else {
                img.src = '';
                img.style.display = 'none';
                placeholder.style.display = 'none';
                laskuri.innerText = "Ei kuvia";
            }
        }

        // ==========================================
        // KÄYNNISTYS — lataa vain ID:t, näytä yksi kuva per kierros
        // ==========================================
        window.onload = async function () {
            db = await avaaDB();
            kuvaIdt = await lataaKuvienIdtDB();

            // Lue edellinen indeksi localStoragesta
            var tallennettu = parseInt(localStorage.getItem('lounas_kuva_indeksi'), 10);
            if (!isNaN(tallennettu) && tallennettu < kuvaIdt.length) {
                nykyinenKuva = tallennettu;
            }

            await paivitaKuva();

            // Tallenna seuraava indeksi valmiiksi
            if (kuvaIdt.length > 0) {
                localStorage.setItem('lounas_kuva_indeksi', (nykyinenKuva + 1) % kuvaIdt.length);
            }
        };
    </script>
</body>

</html>
