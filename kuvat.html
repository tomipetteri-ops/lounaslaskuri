<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuvat</title>
    <link rel="stylesheet" href="style.css">
    <script src="navigointi.js"></script>
    <script>
        if (localStorage.getItem('lounas_diagnostiikka') === 'true') {
            var s = document.createElement('script');
            s.src = 'diagnostiikka.js';
            document.head.appendChild(s);
        }
    </script>
    <style>
        .kuva-info {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            font-size: 0.85rem;
            border-top: 2px solid black;
            flex-shrink: 0;
        }

        .kuva-info span {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="kuvat-sivu">
        <div class="kuva-nakyma kuva-nakymä" id="kuva-nakyma">
            <div class="kuva-placeholder" id="kuva-placeholder" style="display:none;"></div>
            <img id="kuva-img" src="" style="display:none;" alt="Kuva">
        </div>
        <div class="kuva-info">
            <span id="kuva-laskuri">Ladataan...</span>
            <span onclick="avaaKuvaValitsin()">+ Lis&auml;&auml; kuvia</span>
            <input type="file" id="kuva-input-lisaa" accept="image/*" multiple onchange="lisaaKuvat(event)"
                style="display:none;">
            <span onclick="tyhjennaKuvat()">Tyhjenna</span>
        </div>
    </div>

    <script>
        // ==========================================
        // ASETUKSET
        // ==========================================
        // Kuvasivun koko esitysaika tulee index.html:sta.

        // ==========================================
        // INDEXEDDB
        // ==========================================
        const DB_NIMI = 'lounaslaskuri_kuvat';
        const DB_VERSIO = 1;
        const STORE_NIMI = 'kuvat';
        let db = null;

        function avaaDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NIMI, DB_VERSIO);
                req.onupgradeneeded = function (e) {
                    const tietokanta = e.target.result;
                    if (!tietokanta.objectStoreNames.contains(STORE_NIMI)) {
                        tietokanta.createObjectStore(STORE_NIMI, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = function (e) { resolve(e.target.result); };
                req.onerror = function (e) { reject(e); };
            });
        }

        function tallennaKuvaDB(data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readwrite');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.add({ data: data });
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e);
            });
        }

        function lataaKuvienIdtDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readonly');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.getAllKeys();
                req.onsuccess = (e) => resolve(e.target.result || []);
                req.onerror = (e) => reject(e);
            });
        }

        function lataaKuvaDataDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readonly');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.get(id);
                req.onsuccess = (e) => resolve(e.target.result ? e.target.result.data : null);
                req.onerror = (e) => reject(e);
            });
        }

        function tyhjennaDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NIMI, 'readwrite');
                const store = tx.objectStore(STORE_NIMI);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e);
            });
        }

        // ==========================================
        // KUVAT
        // ==========================================
        let kuvaIdt = [];
        let nykyinenKuva = 0;
        let kuvaValitsinAuki = false;
        let kuvaKasittelyKaynnissa = false;

        function pysaytaDia() {
            try { window.parent.postMessage('pysayta', '*'); } catch (e) { }
        }

        function jatkaDia() {
            try { window.parent.postMessage('jatka', '*'); } catch (e) { }
        }

        function avaaKuvaValitsin() {
            const input = document.getElementById('kuva-input-lisaa');
            if (!input || kuvaKasittelyKaynnissa) return;
            kuvaValitsinAuki = true;
            pysaytaDia();
            input.click();
        }

        window.addEventListener('focus', function () {
            if (!kuvaValitsinAuki || kuvaKasittelyKaynnissa) return;
            // Jos valitsin suljettiin ilman uusia tiedostoja, jatka diaesitysta.
            setTimeout(function () {
                if (kuvaValitsinAuki && !kuvaKasittelyKaynnissa) {
                    kuvaValitsinAuki = false;
                    jatkaDia();
                }
            }, 400);
        });

        async function lisaaKuvat(event) {
            const tiedostot = Array.from(event.target.files || []);
            kuvaValitsinAuki = false;
            kuvaKasittelyKaynnissa = true;

            let virheita = 0;
            try {
                if (tiedostot.length === 0) return;

                for (const tiedosto of tiedostot) {
                    // Kasittele jokainen tiedosto erikseen: yksi viallinen tiedosto
                    // (lukuvirhe / IndexedDB-kiintio) ei keskeyta koko erää.
                    try {
                        const dataUrl = await new Promise(function (resolve, reject) {
                            const reader = new FileReader();
                            reader.onload = function (e) { resolve(e.target.result); };
                            reader.onerror = function () { reject(reader.error || new Error('FileReader')); };
                            reader.readAsDataURL(tiedosto);
                        });

                        const uusiId = await tallennaKuvaDB(dataUrl);
                        kuvaIdt.push(uusiId);
                    } catch (e) {
                        virheita++;
                        console.error('Kuvan lisays epaonnistui:', tiedosto && tiedosto.name, e);
                    }
                }

                nykyinenKuva = 0;
                await paivitaKuva();
                localStorage.setItem('lounas_kuva_indeksi', kuvaIdt.length > 1 ? '1' : '0');
                if (virheita > 0) {
                    const laskuri = document.getElementById('kuva-laskuri');
                    if (laskuri) laskuri.innerText += '  (' + virheita + ' epaonnistui)';
                }
            } finally {
                kuvaKasittelyKaynnissa = false;
                event.target.value = '';
                jatkaDia();
            }
        }

        async function tyhjennaKuvat() {
            if (!confirm('Poistetaanko kaikki kuvat?')) return;
            kuvaIdt = [];
            await tyhjennaDB();
            document.getElementById('kuva-img').src = '';
            await paivitaKuva();
            localStorage.setItem('lounas_kuva_indeksi', '0');
        }

        async function paivitaKuva() {
            const img = document.getElementById('kuva-img');
            const placeholder = document.getElementById('kuva-placeholder');
            const laskuri = document.getElementById('kuva-laskuri');

            if (kuvaIdt.length > 0) {
                if (nykyinenKuva >= kuvaIdt.length) nykyinenKuva = 0;

                const data = await lataaKuvaDataDB(kuvaIdt[nykyinenKuva]);
                if (data) {
                    img.src = data;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                    laskuri.innerText = (nykyinenKuva + 1) + ' / ' + kuvaIdt.length;
                } else {
                    kuvaIdt.splice(nykyinenKuva, 1);
                    await paivitaKuva();
                }
            } else {
                img.src = '';
                img.style.display = 'none';
                placeholder.style.display = 'none';
                laskuri.innerText = 'Ei kuvia';
            }
        }

        // ==========================================
        // KAYNNISTYS
        // ==========================================
        window.onload = async function () {
            db = await avaaDB();
            kuvaIdt = await lataaKuvienIdtDB();

            const tallennettu = parseInt(localStorage.getItem('lounas_kuva_indeksi'), 10);
            if (!isNaN(tallennettu) && tallennettu < kuvaIdt.length) {
                nykyinenKuva = tallennettu;
            }

            await paivitaKuva();

            if (kuvaIdt.length > 0) {
                localStorage.setItem('lounas_kuva_indeksi', String((nykyinenKuva + 1) % kuvaIdt.length));
            }
        };
    </script>
    <script src="versio.js"></script>
</body>

</html>
